<form class="example-form">
  <mat-form-field>

    <input type="text"
      matInput
      placeholder="Instrument suchen"
      [formControl]="control"
      [matAutocomplete]="auto"
      class="example-input">
    <mat-autocomplete #auto="matAutocomplete">
      @for (street of filteredStreets | async; track street) {
        <mat-option [value]="street">
          {{street}}
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</form>
